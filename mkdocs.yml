site_name: System Design Interview Notes
site_description: Notes based on "System Design Interview - An Insider's Guide" (Vol 1 & 2)

# The Markdown chapters live at the repository root (one folder per chapter),
# alongside their PNG diagrams. The same-dir plugin lets MkDocs use the repo
# root as the docs directory without moving any files.
docs_dir: .
# Build output must live outside docs_dir (the repo root); `mkdocs serve` uses
# its own temp dir and ignores this value.
site_dir: /tmp/system-design-site

# Keep tooling and theme-override files out of the rendered site content.
# (The PWA assets — manifest.webmanifest, sw.js, pwa/ — are intentionally NOT
# excluded so they get copied into the site and served.)
exclude_docs: |
  /overrides/
  requirements-docs.txt

# Chapters reference their PNG diagrams with raw <img src="./images/..."> tags.
# MkDocs does not rewrite links inside raw HTML, so keep each rendered page at
# the same directory depth as its source .md file (no per-page subfolders).
use_directory_urls: false

plugins:
  - same-dir
  - search

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - toc.follow
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

