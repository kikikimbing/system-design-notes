{% extends "base.html" %}

{% block extrahead %}
  <link rel="manifest" href="{{ 'pwa/manifest.webmanifest' | url }}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SD Notes">
  <link rel="apple-touch-icon" href="{{ 'pwa/apple-touch-icon.png' | url }}">
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("{{ 'sw.js' | url }}").catch(function (e) {
          console.error("SW registration failed:", e);
        });
      });
    }
  </script>
{% endblock %}
